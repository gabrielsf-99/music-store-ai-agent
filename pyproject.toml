[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: requires Docker (Postgres container)",
    "e2e: full agent graph with a real LLM (requires Docker and OPENROUTER_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
