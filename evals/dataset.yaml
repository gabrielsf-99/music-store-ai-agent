# Conjunto de avaliação do agente. Roda contra o banco com os dados reais ingeridos.
#
# Cada caso tem um ou mais turnos na mesma conversa. Expectativas por turno (todas opcionais):
#   tools:     o agente deve chamar ao menos uma destas tools; [] = nenhuma tool
#   scope:     decisão esperada do guardrail (texto ou lista de aceitas); padrão: in_scope
#   facts:     todos devem aparecer na resposta (sem diferenciar maiúsculas e acentos)
#   facts_any: ao menos um deve aparecer
#   forbid:    nenhum pode aparecer
# Contatos de clientes não ficam aqui: {order_email:N} e {order_phone:N} são lidos do banco.

- id: catalog_guitars_under_1000
  category: catálogo
  turns:
    - user: Quais opções de violões disponíveis custando até R$1000?
      tools: [search_products]
      forbid: [GF-3D, SN-7C]  # esgotado e descontinuado

- id: catalog_price
  category: catálogo
  turns:
    - user: Quanto custa o Takamine GD20?
      tools: [get_product_details, search_products]
      facts: ["2.199,00"]

- id: catalog_out_of_stock
  category: catálogo
  turns:
    - user: Tem o Giannini GF-3D?
      tools: [get_product_details, search_products]
      facts_any: [esgotado, sem estoque, indisponível, em falta]

- id: catalog_coming_soon
  category: catálogo
  turns:
    - user: O ukulele Kala KA-ABP-CTG Barítono está disponível?
      tools: [get_product_details, search_products]
      facts_any: [em breve, lançamento, ainda não, pré-venda]

- id: catalog_promotions
  category: catálogo
  turns:
    - user: Tem alguma promoção rolando?
      tools: [list_active_promotions]
      facts: [CK-20, 20%]
      forbid: [GD20]  # promoção inativa

- id: catalog_installments
  category: catálogo
